[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ppmoe"
version = "0.1.0"
description = "Parameter-preserving dense-to-sparse MoE research tools"
requires-python = ">=3.11,<3.12"
dependencies = [
  "datasets>=4,<5",
  "matplotlib>=3.10,<4",
  "torch>=2.6,<3",
  "transformers>=5.12,<6",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
]
distill = [
  "accelerate==1.15.0",
  "bitsandbytes==0.50.2",
  "peft==0.21.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ppmoe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA-capable GPU",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
